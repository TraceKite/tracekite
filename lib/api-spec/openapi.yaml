        \ the folding rules (min-confidence rollup,\nintra-group counts, the explicit unowned group) live\
        \ in core, so a\nlibrary host aggregating its own map gets the identical answer."
      operationId: service_map_aggregate_api_v2_service_map_aggregate_get
