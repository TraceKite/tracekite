      - in: query
        name: by
        required: false
        schema:
          default: domain
          pattern: ^(domain|team)$
          title: By
          type: string
      - in: query
        name: min_confidence
        required: false
        schema:
          default: 0.6
          maximum: 1.0
          minimum: 0.0
          title: Min Confidence
          type: number
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Service Map Aggregate
