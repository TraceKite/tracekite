name: Bug report
description: Report reproducible incorrect or unexpected behavior
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities or include private source, tokens, or
        secrets here. Use the private process in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: TraceKite version
      description: Release, commit SHA, or container image identifier
      placeholder: 0.1.0 or abc1234
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Core library
        - CLI
        - MCP
        - Server API
        - Web UI
        - Docker Compose
        - Packaging or installation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic or redacted inputs only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the complete error text after removing sensitive data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, Python version, and install method
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive data check
      options:
        - label: I removed secrets, credentials, and private source from this report.
          required: true
