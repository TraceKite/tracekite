# Build and publish tracekite-core when an intentional GitHub Release is made.
# PyPI Trusted Publishing must match this repository, workflow, and the
# protected `pypi` environment before the publish job can obtain a token.

name: publish-pypi

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Match the release tag to the package version
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("packaging/tracekite-core/pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v${PACKAGE_VERSION}" != "$GITHUB_REF_NAME" ]; then
            echo "release tag $GITHUB_REF_NAME does not match tracekite-core $PACKAGE_VERSION"
            exit 1
          fi

      - name: Verify the checked-out release commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Test the release source
        run: |
          uv sync --frozen
          .venv/bin/python -m pytest backend/tests -q
          .venv/bin/python backend/tools/check_layers.py
          .venv/bin/python backend/tools/check_invariants.py
          .venv/bin/python backend/tools/export_openapi.py --check

      - name: Test and build the web application
        run: |
          corepack enable
          pnpm install --frozen-lockfile --filter '@tracekite/web...'
          pnpm --filter @tracekite/web run typecheck
          pnpm --filter @tracekite/web run test
          pnpm --filter @tracekite/web run build

      - name: Build source and wheel distributions
        run: uv build --project packaging/tracekite-core --out-dir dist

      - name: Validate distribution metadata
        run: uvx --from twine twine check dist/*

      - name: Smoke-test the installed wheel
        run: |
          uv venv --python 3.13 .wheel-env
          uv pip install --python .wheel-env/bin/python dist/tracekite_core-*.whl
          .wheel-env/bin/python scripts/release_smoke.py \
            --tracekite .wheel-env/bin/tracekite

      - name: Smoke-test the installed source distribution
        run: |
          uv venv --python 3.13 .sdist-env
          uv pip install --python .sdist-env/bin/python dist/tracekite_core-*.tar.gz
          .sdist-env/bin/python scripts/release_smoke.py \
            --tracekite .sdist-env/bin/tracekite

      - name: Record distribution checksums
        run: (cd dist && sha256sum *) > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: tracekite-core-dist
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tracekite-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tracekite-core-dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  verify-registry:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the published version from PyPI
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5; do
            python -m pip install --no-cache-dir "tracekite-core==${VERSION}" \
              && break
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep 15
          done
          tracekite --help

  release-assets:
    needs: [build, verify-registry]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tracekite-core-dist
      - name: Attach distributions and checksums to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* SHA256SUMS --clobber
