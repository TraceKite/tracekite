server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The base image ships gzip commented out, so the SPA was served raw: a
    # 535 KB first paint (264 KB app + 183 KB force-graph + 76 KB CSS) that
    # reads as "the UI is slow" on any non-local link. These types compress
    # ~4x. gzip_proxied any + Vary keeps the /api/ proxy responses compressed
    # for the browser without letting an intermediary cache a gzipped body
    # for a client that cannot read one.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # Hashed Vite assets are immutable; index.html must never be cached or
    # clients pin a stale bundle against a redeployed backend.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Same-origin API. Everything under /api reaches FastAPI; nothing else does,
    # so a mistyped path falls through to the SPA below and returns 200 HTML —
    # health checks must target the backend directly, never through here.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ingest and link runs are long; do not cut them off at the default 60s.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # The browser needs the real backend /health: it reports whether a token
    # is required at all, and diagnose() uses it to tell a bad credential from
    # a Neo4j outage. Without this it fell through to the SPA and returned 200
    # text/html, so every JSON parse threw and both checks silently failed.
    # (The CONTAINER healthcheck still targets the backend directly.)
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
