<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 was blocking pinch-zoom, which is an accessibility
         failure, not a layout safeguard. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TraceKite — cross-repo dependency tracing</title>
    <meta name="description" content="Trace request paths, blast radius, messaging chains and config ownership across every repository in your estate, with per-edge confidence and file-level evidence." />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="TraceKite — cross-repo dependency tracing" />
    <meta property="og:description" content="Trace request paths, blast radius, messaging chains and config ownership across every repository in your estate." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand/png/tracekite-horizontal.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores SVG icons; 256px is the largest size the pack exports below
         the 512 that home-screen adds downscale anyway. -->
    <link rel="apple-touch-icon" href="/brand/png/tracekite-256.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Inter for UI, JetBrains Mono for code, paths, identifiers and
         numerics. `font-mono` was used 11 times with no mono font loaded. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
