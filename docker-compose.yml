name: adduce

# Required secrets have no defaults on purpose — compose fails fast rather than
# booting with a known-default Neo4j password or an unauthenticated API.
# Copy .env.example to .env and fill it in before `docker compose up`.

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: adduce-neo4j
    ports:
      - "${NEO4J_HTTP_PORT:-27474}:7474"
      - "${NEO4J_BOLT_PORT:-27687}:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP:-2G}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE:-1G}"
      # Unbounded transactions let one runaway trace query pin the database.
      NEO4J_db_transaction_timeout: "120s"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks: [adduce]
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: adduce-backend
    ports:
      # Loopback only: anonymous reads are enabled below, so the API must
      # not be reachable from the network. Override BIND_ADDR to change.
      - "${BIND_ADDR:-127.0.0.1}:${BACKEND_PORT:-28000}:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}"
      API_TOKEN: "${API_TOKEN:-}"
      # Auth off by default for this local stack: no token for any route,
      # writes included. Safe ONLY because BIND_ADDR keeps the ports on
      # loopback. Set AUTH_ENABLED=true if you change BIND_ADDR.
      AUTH_ENABLED: "${AUTH_ENABLED:-false}"
      ALLOW_ANONYMOUS_READS: "${ALLOW_ANONYMOUS_READS:-true}"
      GRAPH_HMAC_KEY: "${GRAPH_HMAC_KEY:?GRAPH_HMAC_KEY is required}"
      WORKSPACE_DIR: /app/data/repos
      AUDIT_LOG_PATH: /app/var/audit.log
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      ALLOWED_GIT_HOSTS: "${ALLOWED_GIT_HOSTS:-github.com}"
      # Browser traffic is same-origin through the nginx proxy, so no origin
      # needs to be allowlisted unless the UI is served from elsewhere.
      ADDUCE_CORS_ORIGINS: "${ADDUCE_CORS_ORIGINS:-}"
      INGEST_WORKERS: "${INGEST_WORKERS:-2}"
      MAX_SCOPE_REPOS: "${MAX_SCOPE_REPOS:-10}"
    volumes:
      - repo_workspace:/app/data/repos
      - backend_var:/app/var
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)\""]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks: [adduce]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: adduce-frontend
    ports:
      # Loopback only: the UI proxies /api, so exposing it would expose
      # the API too.
      - "${BIND_ADDR:-127.0.0.1}:${FRONTEND_PORT:-28080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [adduce]
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  repo_workspace:
  backend_var:

networks:
  adduce:
    driver: bridge
